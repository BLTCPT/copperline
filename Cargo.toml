[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
copperline-money = { path = "crates/money" }
copperline-model = { path = "crates/model" }
copperline-pricing = { path = "crates/pricing" }
copperline-storage = { path = "crates/storage" }
copperline-engine = { path = "crates/engine" }
copperline-ui = { path = "crates/ui" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
sha2 = "0.10.9"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[workspace.lints.rust]
unsafe_code = "forbid"
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[profile.dev]
opt-level = 1
[profile.release]
lto = "thin"
